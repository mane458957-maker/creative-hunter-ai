name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "config/candidate-profile.json"
      - "scripts/**"
      - ".github/workflows/pages.yml"
  schedule:
    - cron: "0 1,7,13,19 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare dashboard
        run: |
          mkdir -p _site/data
          cp index.html _site/index.html
      - name: Refresh all sources on schedule or Jobicy on demand
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          JOBICY_ONLY: false
          EXPANDED_ONLY: ${{ github.event_name == 'workflow_dispatch' }}
        run: node scripts/build-opportunities.mjs
      - name: Keep the latest snapshot during dashboard updates
        if: github.event_name == 'push'
        run: curl --fail --silent --show-error https://mane458957-maker.github.io/creative-hunter-ai/data/opportunities.json --output _site/data/opportunities.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
