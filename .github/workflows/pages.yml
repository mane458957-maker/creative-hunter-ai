name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "config/candidate-profile.json"
      - "scripts/**"
      - ".github/workflows/pages.yml"
  schedule:
    - cron: "0 1,7,13,19 * * *"
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare dashboard
        run: |
          mkdir -p _site/data
          cp index.html _site/index.html
      - name: Refresh public feeds
        env:
          EXPANDED_ONLY: ${{ github.event_name != 'schedule' || github.event.schedule == '*/15 * * * *' }}
          FREELANCER_ONLY: ${{ github.event.schedule == '*/15 * * * *' }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: node scripts/build-opportunities.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
